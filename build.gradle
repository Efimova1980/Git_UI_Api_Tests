plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'org.seleniumhq.selenium', name: 'selenium-java', version: '4.47.0'
    implementation group: 'org.testng', name: 'testng', version: '7.12.0'

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    testImplementation 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'
    implementation 'com.networknt:json-schema-validator:1.5.6'

    implementation 'io.rest-assured:rest-assured:5.5.7'
}

test {
    useTestNG()
    systemProperties = System.properties

}
